<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem('lms-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<title>Issue &amp; Return — Reading Room</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div class="mobile-topbar">
      <button class="menu-toggle" onclick="openSidebar()" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <div class="brand">Reading Room</div>
      <div style="width:38px;"></div>
    </div>
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" onclick="closeSidebar()" aria-label="Close menu">&times;</button>
      <div class="brand">Reading Room</div>
      <div class="brand-sub">Library Management System</div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="books.html">Books</a>
        <a href="members.html">Members</a>
        <a href="transactions.html" class="active">Issue &amp; Return</a>
      </nav>
      <div class="user-box">
        <div class="name" id="sidebar-user-name">—</div>
        <div class="role" id="sidebar-user-role">—</div>
        <button class="theme-toggle" onclick="toggleTheme()"><span class="theme-toggle-label">Dark mode</span></button>
        <button class="btn btn-secondary" style="width:100%" onclick="handleLogoutClick()">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <div>
          <h1>Issue &amp; return</h1>
          <p>Loan a book to a member, or record a return and settle any fine.</p>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary" id="check-reminders-btn" onclick="handleCheckReminders()">Send Due Reminders</button>
          <button class="btn btn-primary" onclick="openIssueModal()">Issue a book</button>
        </div>
      </div>

      <div class="ledger-panel">
        <div class="ledger-toolbar">
          <strong>Loan history</strong>
          <select id="status-filter">
            <option value="">All</option>
            <option value="issued">Issued</option>
            <option value="returned">Returned</option>
          </select>
        </div>
        <table class="ledger">
          <thead>
            <tr><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Returned</th><th>Fine</th><th>Status</th><th>Reminder</th><th></th></tr>
          </thead>
          <tbody id="txn-body">
            <tr><td colspan="9" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="issue-modal">
    <div class="modal-box">
      <h2>Issue a book</h2>
      <form id="issue-form">
        <div class="field">
          <label for="issue-book">Book</label>
          <select id="issue-book" required></select>
        </div>
        <div class="field">
          <label for="issue-member">Member</label>
          <select id="issue-member" required></select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeIssueModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Issue book</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
