<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem('lms-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<title>Books — Reading Room</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <div class="mobile-topbar">
      <button class="menu-toggle" onclick="openSidebar()" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <div class="brand">Reading Room</div>
      <div style="width:38px;"></div>
    </div>
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" onclick="closeSidebar()" aria-label="Close menu">&times;</button>
      <div class="brand">Reading Room</div>
      <div class="brand-sub">Library Management System</div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="books.html" class="active">Books</a>
        <a href="members.html">Members</a>
        <a href="transactions.html">Issue &amp; Return</a>
      </nav>
      <div class="user-box">
        <div class="name" id="sidebar-user-name">—</div>
        <div class="role" id="sidebar-user-role">—</div>
        <button class="theme-toggle" onclick="toggleTheme()"><span class="theme-toggle-label">Dark mode</span></button>
        <button class="btn btn-secondary" style="width:100%" onclick="handleLogoutClick()">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <div>
          <h1>Book catalog</h1>
          <p>Add titles, track copies, and keep shelf details up to date.</p>
        </div>
        <button class="btn btn-primary" onclick="openBookModal()">Add a book</button>
      </div>

      <div class="ledger-panel">
        <div class="ledger-toolbar">
          <div class="search-box">
            <input type="text" id="search-input" placeholder="Search by title, author, or ISBN…">
          </div>
        </div>
        <table class="ledger">
          <thead>
            <tr><th>Title</th><th>Author</th><th>Category</th><th>Copies</th><th>Available</th><th>Shelf</th><th></th></tr>
          </thead>
          <tbody id="books-body">
            <tr><td colspan="7" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add / edit book modal -->
  <div class="modal-overlay" id="book-modal">
    <div class="modal-box">
      <h2 id="book-modal-title">Add a book</h2>
      <form id="book-form">
        <input type="hidden" id="book-id">
        <div class="form-grid">
          <div class="field full">
            <label for="book-title">Title</label>
            <input type="text" id="book-title" required>
          </div>
          <div class="field full">
            <label for="book-author">Author</label>
            <input type="text" id="book-author" required>
          </div>
          <div class="field">
            <label for="book-isbn">ISBN</label>
            <input type="text" id="book-isbn">
          </div>
          <div class="field">
            <label for="book-category">Category</label>
            <input type="text" id="book-category">
          </div>
          <div class="field">
            <label for="book-publisher">Publisher</label>
            <input type="text" id="book-publisher">
          </div>
          <div class="field">
            <label for="book-shelf">Shelf location</label>
            <input type="text" id="book-shelf">
          </div>
          <div class="field full">
            <label for="book-copies">Total copies</label>
            <input type="number" id="book-copies" min="1" value="1" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeBookModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save book</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/books.js"></script>
</body>
</html>
